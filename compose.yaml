services:
  beast:
    build: .
    restart: unless-stopped
    init: true
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set GEMINI_API_KEY in a private .env file}
      BEAST_ACCESS_TOKEN: ${BEAST_ACCESS_TOKEN:?Set a long random BEAST_ACCESS_TOKEN in your private .env file}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - beast-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 512m
    cpus: 1.0
volumes:
  beast-data:
