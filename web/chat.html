<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10131b"><title>Beast Chat</title><style>body{margin:0;background:#10131b;color:#f0f2f6;font:16px system-ui}main{max-width:740px;margin:auto;height:100dvh;display:flex;flex-direction:column}header{padding:18px;border-bottom:1px solid #303847}h1{margin:0;font-size:22px}small{color:#aab5c7}#log{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}.bubble{padding:12px 15px;border-radius:16px;max-width:85%;white-space:pre-wrap;overflow-wrap:anywhere;background:#262e3b}.mine{align-self:flex-end;background:#324c75}.beast{align-self:flex-start}form{display:flex;gap:8px;padding:12px;border-top:1px solid #303847}textarea{flex:1;min-width:0;resize:none;border:1px solid #465165;border-radius:12px;padding:12px;background:#1b2230;color:white;font:inherit}button{background:#8caef8;color:#10131b;border:0;border-radius:12px;padding:0 18px;font-weight:700}button:disabled{opacity:.5}</style></head><body><main><header><h1>🐺 Beast</h1><small id="status">Local development chat · Gemini connection required</small></header><section id="log" role="log" aria-live="polite"><div class="bubble beast">Beast chat interface ready. Responses depend on the server's Gemini configuration.</div></section><form id="form"><textarea id="message" rows="2" maxlength="4000" aria-label="Message Beast" placeholder="Message Beast..." required></textarea><button id="send" type="submit">Send</button></form></main><script>const form=document.getElementById("form"),input=document.getElementById("message"),log=document.getElementById("log"),button=document.getElementById("send"),status=document.getElementById("status");function add(text,cls){const div=document.createElement("div");div.className="bubble "+cls;div.textContent=text;log.append(div);log.scrollTop=log.scrollHeight;}form.addEventListener("submit",async e=>{e.preventDefault();const message=input.value.trim();if(!message)return;add(message,"mine");input.value="";button.disabled=true;status.textContent="Requesting Gemini response...";try{const response=await fetch("/api/chat",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({message})});const result=await response.json();if(!response.ok)throw Error(result.error||"Request failed");add(result.status==="silent"?"Beast chose not to reply.":result.reply,"beast");status.textContent=result.status==="silent"?"Decision logged in this chat: silent":"Beast replied";}catch(error){add("Connection error: "+error.message,"beast");status.textContent="Not connected";}finally{button.disabled=false;input.focus();}});input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();form.requestSubmit();}});</script></body></html>
